<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google TTS Tiếng Việt</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  margin:0;
  padding:0;
}
.container{
  max-width:700px;
  margin:50px auto;
  background:#1e293b;
  padding:25px;
  border-radius:15px;
}
h1{
  text-align:center;
}
textarea,button,audio,a{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:8px;
  box-sizing:border-box;
  font-size:16px;
}
button,a{
  background:#2563eb;
  color:white;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}
button:hover,a:hover{
  background:#1d4ed8;
}
#audioPlayer{
  display:none;
}
#downloadBtn{
  display:none;
}
</style>
</head>
<body>
<div class="container">
  <h1>🎤 Google TTS Tiếng Việt</h1>

  <textarea id="text" rows="6" placeholder="Nhập nội dung cần đọc..."></textarea>

  <button onclick="generateAudio()">🔊 Tạo giọng nói</button>

  <audio id="audioPlayer" controls></audio>

  <a id="downloadBtn" download="voice.mp3">⬇ Tải file MP3</a>
</div>

<script>
function generateAudio() {
  const text = document.getElementById("text").value.trim();

  if (!text) {
    alert("Vui lòng nhập nội dung");
    return;
  }

  const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=vi&client=tw-ob`;

  const audio = document.getElementById("audioPlayer");
  const downloadBtn = document.getElementById("downloadBtn");

  audio.src = url;
  audio.style.display = "block";
  audio.play();

  downloadBtn.href = url;
  downloadBtn.style.display = "block";
}
</script>
</body>
</html>
