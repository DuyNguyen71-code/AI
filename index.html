<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Clone Giọng Nói</title>
</head>
<body>

<h2>AI Clone Giọng Nói</h2>

<textarea id="text" placeholder="Nhập nội dung"></textarea><br><br>

<input type="text" id="voiceName" placeholder="Tên giọng"><br><br>
<input type="file" id="voiceFile"><br><br>

<button onclick="saveVoice()">Lưu giọng mẫu</button><br><br>

<select id="savedVoices"></select><br><br>

<button onclick="generateAudio()">Tạo giọng nói</button><br><br>

<audio id="audio" controls></audio>

<script>
let voices = JSON.parse(localStorage.getItem("voices") || "[]");

function renderVoices() {
  const select = document.getElementById("savedVoices");
  select.innerHTML = "";

  voices.forEach(v => {
    const option = document.createElement("option");
    option.value = v.voice_id;
    option.textContent = v.name;
    select.appendChild(option);
  });
}

async function saveVoice() {
  const voiceName = document.getElementById("voiceName").value;

  if (!voiceName) {
    alert("Nhập tên giọng");
    return;
  }

  const fakeVoiceId = "voice_" + Date.now();

  voices.push({
    name: voiceName,
    voice_id: fakeVoiceId
  });

  localStorage.setItem("voices", JSON.stringify(voices));

  renderVoices();

  alert("Đã lưu giọng");
}

async function generateAudio() {
  const text = document.getElementById("text").value;
  const voiceId = document.getElementById("savedVoices").value;

  if (!text || !voiceId) {
    alert("Thiếu text hoặc voiceId");
    return;
  }

  const response = await fetch("/api/tts", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      text: text,
      voiceId: voiceId
    })
  });

  if (!response.ok) {
    const error = await response.text();
    alert(error);
    return;
  }

  const blob = await response.blob();
  const url = URL.createObjectURL(blob);

  document.getElementById("audio").src = url;
}

renderVoices();
</script>

</body>
</html>
