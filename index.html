<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Tạo Giọng Nói</title>
<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.box{
width:90%;
max-width:600px;
background:#1e293b;
padding:20px;
border-radius:15px;
}
textarea,button,audio{
width:100%;
margin-top:10px;
padding:12px;
border-radius:8px;
border:none;
font-size:16px;
box-sizing:border-box;
}
button{
background:#2563eb;
color:white;
cursor:pointer;
}
</style>
</head>
<body>
<div class="box">
<h2>🎤 AI Tạo Giọng Nói</h2>

<textarea id="text" placeholder="Nhập nội dung cần đọc"></textarea>

<button onclick="generateAudio()">Tạo giọng nói</button>

<audio id="audio" controls></audio>
</div>

<script>
async function generateAudio() {
  const text = document.getElementById("text").value;

  const response = await fetch("/api/tts", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      text: text
    })
  });

  if (!response.ok) {
    const error = await response.text();
    alert(error);
    return;
  }

  const blob = await response.blob();
  const url = URL.createObjectURL(blob);

  document.getElementById("audio").src = url;
}
</script>
</body>
</html>
