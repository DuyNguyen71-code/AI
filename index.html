<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tạo Giọng Nói</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    textarea {
      width: 100%;
      height: 150px;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #3b82f6;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎤 AI Tạo Giọng Nói</h1>
    <textarea id="text" placeholder="Nhập nội dung cần đọc..."></textarea>
    <button onclick="speakText()">Tạo giọng nói</button>
  </div>

  <script>
    function speakText() {
      const text = document.getElementById("text").value;

      if (!text) {
        alert("Vui lòng nhập nội dung");
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "vi-VN";
      utterance.rate = 1;
      utterance.pitch = 1;

      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
