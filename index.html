<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Voice Generator</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  margin:0;
  padding:0;
}
.container{
  max-width:700px;
  margin:50px auto;
  background:#1e293b;
  padding:25px;
  border-radius:15px;
}
h1{text-align:center;}
textarea,select,button,a{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:8px;
  box-sizing:border-box;
  font-size:16px;
}
button,a{
  background:#2563eb;
  color:white;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}
button:hover{
  background:#1d4ed8;
}
#audioDownload{
  display:none;
}
</style>
</head>
<body>
<div class="container">
  <h1>🎤 AI Voice Generator</h1>

  <label>Nhập nội dung:</label>
  <textarea id="text" rows="6" placeholder="Nhập nội dung cần đọc..."></textarea>

  <label>Chọn giọng:</label>
  <select id="voiceSelect"></select>

  <label>Tốc độ đọc:</label>
  <select id="speed">
    <option value="0.8">Chậm</option>
    <option value="1" selected>Bình thường</option>
    <option value="1.2">Nhanh</option>
    <option value="1.5">Rất nhanh</option>
  </select>

  <button onclick="speakText()">🔊 Phát giọng</button>
  <button onclick="downloadAudio()">⬇ Tạo file tải về</button>

  <a id="audioDownload" download="voice.wav">⬇ Tải file âm thanh</a>
</div>

<script>
let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
  const voiceSelect = document.getElementById("voiceSelect");
  voiceSelect.innerHTML = "";

  voices.forEach((voice, index) => {
    const option = document.createElement("option");
    option.value = index;
    option.textContent = `${voice.name} (${voice.lang})`;
    voiceSelect.appendChild(option);
  });
}

speechSynthesis.onvoiceschanged = loadVoices;

function speakText() {
  const text = document.getElementById("text").value.trim();
  const voiceIndex = document.getElementById("voiceSelect").value;
  const speed = parseFloat(document.getElementById("speed").value);

  if (!text) {
    alert("Vui lòng nhập nội dung");
    return;
  }

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = voices[voiceIndex];
  utterance.rate = speed;

  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

function downloadAudio() {
  const text = document.getElementById("text").value.trim();
  const blob = new Blob([text], { type: "text/plain" });

  const url = URL.createObjectURL(blob);
  const link = document.getElementById("audioDownload");

  link.href = url;
  link.style.display = "block";
}
loadVoices();
</script>
</body>
</html>
