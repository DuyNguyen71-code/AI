<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Clone Giọng Nói</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 700px;
    }
    textarea, select, input {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      border: none;
    }
    button, a {
      display: block;
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      text-align: center;
      border: none;
      border-radius: 12px;
      background: #3b82f6;
      color: white;
      font-size: 18px;
      text-decoration: none;
      cursor: pointer;
    }
    audio {
      width: 100%;
      margin-top: 15px;
    }
    .saved-voices {
      margin-top: 20px;
      background: rgba(255,255,255,0.05);
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎤 AI Clone Giọng Nói</h1>

    <textarea id="text" placeholder="Nhập nội dung cần đọc..."></textarea>

    <label>Tốc độ đọc</label>
    <select id="speed">
      <option value="0.6">1 - Rất chậm</option>
      <option value="0.8">2 - Chậm</option>
      <option value="1" selected>3 - Bình thường</option>
      <option value="1.2">4 - Nhanh</option>
      <option value="1.5">5 - Rất nhanh</option>
    </select>

    <label>Tên giọng mẫu</label>
    <input type="text" id="voiceName" placeholder="Ví dụ: Giọng Nam của tôi">

    <label>Upload giọng mẫu</label>
    <input type="file" id="voiceFile" accept="audio/*">

    <button onclick="saveVoice()">Lưu giọng mẫu</button>

    <label>Chọn giọng đã lưu</label>
    <select id="savedVoices"></select>

    <button onclick="generateAudio()">Tạo giọng nói</button>
    <audio id="audio" controls></audio>
    <a id="downloadLink" style="display:none;" download="voice.mp3">Tải file MP3</a>

    <div class="saved-voices" id="voiceList"></div>
  </div>

  <script>
    const apiKey = "sk_bd4e50ee3d9a1f81713a21c793844790453731512366d7ea";
    let voices = JSON.parse(localStorage.getItem("voices") || "[]");

    function renderVoices() {
      const select = document.getElementById("savedVoices");
      const list = document.getElementById("voiceList");
      select.innerHTML = "";
      list.innerHTML = "<h3>Giọng đã lưu:</h3>";
      voices.forEach(v => {
        select.innerHTML += `<option value="${v.voice_id}">${v.name}</option>`;
        list.innerHTML += `<p>${v.name}</p>`;
      });
    }

    async function saveVoice() {
      const fileInput = document.getElementById("voiceFile");
      const voiceName = document.getElementById("voiceName").value;
      if (!fileInput.files.length || !voiceName) {
        alert("Vui lòng nhập tên giọng và chọn file âm thanh");
        return;
      }

      const formData = new FormData();
      formData.append("name", voiceName);
      formData.append("files", fileInput.files[0]);

      const response = await fetch("https://api.elevenlabs.io/v1/voices/add", {
        method: "POST",
        headers: { "xi-api-key": apiKey },
        body: formData
      });

      const data = await response.json();
      voices.push({ name: voiceName, voice_id: data.voice_id });
      localStorage.setItem("voices", JSON.stringify(voices));
      renderVoices();
      alert("Đã lưu giọng thành công");
    }

    async function generateAudio() {
      const text = document.getElementById("text").value;
      const voiceId = document.getElementById("savedVoices").value;
      const speed = document.getElementById("speed").value;
      const audio = document.getElementById("audio");
      const downloadLink = document.getElementById("downloadLink");

      const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
        method: "POST",
        headers: {
          "xi-api-key": apiKey,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text: text,
          model_id: "eleven_multilingual_v2"
        })
      });

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      audio.src = url;
      audio.playbackRate = parseFloat(speed);
      audio.play();
      downloadLink.href = url;
      downloadLink.style.display = "block";
    }

    renderVoices();
  </script>
</body>
</html>
